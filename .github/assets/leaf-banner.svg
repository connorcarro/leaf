      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1f18" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Modified Font Awesome Free leaf icon -->
