name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build runnable jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile, test, and package
        shell: pwsh
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          New-Item -ItemType Directory -Force build/check-classes, build/classes | Out-Null

          $checkSources = Get-ChildItem -Path src, tests -Recurse -Filter *.java | Select-Object -ExpandProperty FullName
          javac -source 8 -target 8 -Xlint:deprecation -d build/check-classes $checkSources

          $configDir = Join-Path $env:RUNNER_TEMP "leaf-config"
          $env:JAVA_TOOL_OPTIONS = "$env:JAVA_TOOL_OPTIONS -Dleaf.config.dir=$configDir"
          java -cp build/check-classes editor.Main --self-test
          java -cp build/check-classes ci.SmokeTests

          $appSources = Get-ChildItem -Path src -Recurse -Filter *.java | Select-Object -ExpandProperty FullName
          javac -source 8 -target 8 -Xlint:deprecation -d build/classes $appSources

          jar --create --file leaf.jar --main-class editor.Main -C build/classes .
          java -jar leaf.jar --self-test

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run release jar startup smoke test
        env:
          JAVA_TOOL_OPTIONS: -Dleaf.config.dir=${{ runner.temp }}/leaf-config
        run: |
          xvfb-run -a java -jar leaf.jar --startup-test

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: leaf-jar
          path: leaf.jar

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" leaf.jar --title "Leaf ${GITHUB_REF_NAME}" --notes "Runnable Java archive for Leaf."
