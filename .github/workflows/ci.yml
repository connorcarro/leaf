name: CI

on:
  push:
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Compile and run feature smoke tests
        shell: pwsh
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $sourceFiles = Get-ChildItem -Path src, tests -Recurse -Filter *.java | Select-Object -ExpandProperty FullName
          javac --release 22 -Xlint:deprecation -d out $sourceFiles
          $configDir = Join-Path $env:RUNNER_TEMP "leaf-config"
          $env:JAVA_TOOL_OPTIONS = "$env:JAVA_TOOL_OPTIONS -Dleaf.config.dir=$configDir"
          java -cp out editor.Main --self-test
          java -cp out ci.SmokeTests
